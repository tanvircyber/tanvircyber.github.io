backend:
  name: github
  repo: tanvircyber/tanvircyber.github.io
  branch: main
  base_url: https://tanvircyber-oauth-gateway.caelumtanvir.workers.dev
  auth_endpoint: api/auth

# Editorial workflow off = saves commit straight to main and go live on next
# GitHub Pages build (usually under a minute). Flip to true later if you want
# a draft/review step before changes go live.
publish_mode: simple

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "portfolio"
    label: "Portfolio"
    files:
      - name: "content"
        label: "Site Content"
        file: "content/portfolio.json"
        fields:
          - label: "Status line"
            name: "status"
            widget: "string"
            hint: "Shown in the hero terminal boot log, e.g. 'learning, building, shipping'"

          - label: "About"
            name: "about"
            widget: "text"
            hint: "The about.md paragraph shown near the top of the site"

          - label: "Languages"
            name: "languages"
            widget: "list"
            summary: "{{module}} — {{status}}"
            fields:
              - label: "Module"
                name: "module"
                widget: "string"
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["ACTIVE", "PLANNED", "ARCHIVED"]
                default: "ACTIVE"
              - label: "Detail"
                name: "detail"
                widget: "text"

          - label: "AI, Agentic Workflows & Automation"
            name: "aiAutomation"
            widget: "list"
            summary: "{{module}} — {{status}}"
            fields:
              - label: "Module"
                name: "module"
                widget: "string"
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["ACTIVE", "PLANNED", "ARCHIVED"]
                default: "ACTIVE"
              - label: "Detail"
                name: "detail"
                widget: "text"

          - label: "Cybersecurity & Hardware"
            name: "cyberHardware"
            widget: "list"
            summary: "{{module}} — {{status}}"
            fields:
              - label: "Module"
                name: "module"
                widget: "string"
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["ACTIVE", "PLANNED", "ARCHIVED"]
                default: "ACTIVE"
              - label: "Detail"
                name: "detail"
                widget: "text"

          - label: "Connect"
            name: "connect"
            widget: "object"
            fields:
              - label: "Email"
                name: "email"
                widget: "string"
                hint: "Used for both the hero button and the connect.sh section — copies to clipboard on click"
              - label: "GitHub URL"
                name: "github"
                widget: "string"

          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{title}} — {{status}}"
            fields:
              - label: "Case ID"
                name: "id"
                widget: "string"
                hint: "e.g. case_07.log — just increment the number for new entries"
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["ACTIVE", "PLANNED", "ARCHIVED"]
                default: "ACTIVE"
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Description"
                name: "description"
                widget: "text"
              - label: "Tags"
                name: "tags"
                widget: "list"
                field: { label: "Tag", name: "tag", widget: "string" }
              - label: "Repo URL"
                name: "repo"
                widget: "string"

          - label: "Roadmap"
            name: "roadmap"
            widget: "list"
            summary: "{{title}} — {{status}}"
            fields:
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["PLANNED", "IN PROGRESS", "DONE"]
                default: "PLANNED"
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Description"
                name: "description"
                widget: "text"
